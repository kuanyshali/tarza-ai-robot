name: Sadam code checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile robot code
        run: python -m py_compile robot.py sadam_features.py wake_listener.py
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
