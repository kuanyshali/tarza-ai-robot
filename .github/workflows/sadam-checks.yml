name: Aisana code checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt vermin numpy
      - name: Compile robot code
        run: python -m py_compile *.py
      - name: Jetson Nano runs Python 3.6 - no newer syntax allowed
        run: vermin -t=3.6- --no-tips --violations *.py tests/*.py
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
